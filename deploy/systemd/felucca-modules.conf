# Kernel modules Felucca needs preloaded (install.sh copies this to
# /etc/modules-load.d/felucca.conf). The hardened units set
# ProtectKernelModules=true, so the services cannot load these themselves.
#
# br_netfilter: routes bridged guest-to-guest frames through netfilter —
#   WITHOUT IT CROSS-TENANT ISOLATION DOES NOT ENFORCE (v4 P1). Workers only,
#   but harmless on the control plane.
br_netfilter
# wireguard: the v4 P2 overlay interface (hub + joined workers).
wireguard

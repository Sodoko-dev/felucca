[package]
name = "hearth-guest"
version = "0.1.0"
edition = "2021"

[lib]
name = "hearth_guest"
path = "src/lib.rs"

[[bin]]
name = "hearth-guest"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
